# Routes database connections to the right Patroni node. Each node's Patroni
# API (port 8008) answers 200 on /primary only if it is the leader, and on
# /replica only if it is a healthy standby, so no node list needs editing when
# the leader changes.

global
    maxconn 1000

defaults
    mode tcp
    timeout connect 4s
    timeout check 3s
    # Pooled connections sit idle for long stretches.
    timeout client 30m
    timeout server 30m

resolvers docker
    nameserver dns 127.0.0.11:53

# Writes: the leader only.
frontend write
    bind *:5000
    default_backend primary

# Reads: the standbys, or the leader when no standby is available.
frontend read
    bind *:5001
    use_backend replicas if { nbsrv(replicas) ge 1 }
    default_backend primary

backend primary
    option httpchk GET /primary
    http-check expect status 200
    # Connections to a node that stops being leader are closed at once, so the
    # pooler reconnects to the new leader instead of writing to a standby.
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr none
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

backend replicas
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr none
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

# Who is leader and which nodes are up, at http://localhost:7000
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 2s
