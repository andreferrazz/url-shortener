; One shared pooler between the app instances and the database cluster.
; The app connects to "local" for writes and "local_ro" for reads; both lead
; to HAProxy, which finds the current leader or a standby.

[databases]
local = host=haproxy port=5000 dbname=local
local_ro = host=haproxy port=5001 dbname=local

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Each query gets whichever database connection is free.
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20

; After a failover, try the database again every second instead of the
; default 15, so the app recovers as soon as a new leader is up.
server_login_retry = 1
; Do not hand out a connection the database side has already closed.
server_check_delay = 0
; Give up on a queued query after 5 seconds; the app has its own deadlines.
query_wait_timeout = 5

ignore_startup_parameters = extra_float_digits
