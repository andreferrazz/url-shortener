# Backups go to an S3-compatible bucket. The access key and secret come from
# PGBACKREST_REPO1_S3_KEY and PGBACKREST_REPO1_S3_KEY_SECRET in the environment.

[global]
repo1-type=s3
repo1-s3-bucket=pgbackrest
repo1-s3-endpoint=bucket
repo1-s3-region=us-east-1
repo1-path=/url-shortener
# Local bucket only: it is addressed as https://bucket:9000/<bucket> and has a
# self-signed certificate. Real object storage needs none of these three.
repo1-storage-host=bucket
repo1-storage-port=9000
repo1-s3-uri-style=path
repo1-storage-verify-tls=n

# Keep the two most recent full backups, and the log needed to restore them.
repo1-retention-full=2
compress-type=zst
# Start a backup immediately instead of waiting for the next checkpoint.
start-fast=y
log-level-console=info
log-level-file=off

[url-shortener]
pg1-path=/var/lib/postgresql/pgdata
pg1-socket-path=/var/run/postgresql
